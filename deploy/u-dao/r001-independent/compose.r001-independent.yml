# R001 独立接入部署模板（G1-P2-RC，版本化工件；占位符经 env-file 注入，不含任何真实值）
#
# 用途：为独立 Broker 部署专属 Adapter/Ingress（共享生产 PG/Redis，不启动第二套
# API/DB/Redis/迁移/任务执行器）。生产 Broker 零变更。
#
# 前置（见同目录 README.md）：
#   1) 生产 DB 备份 + 隔离恢复通过（OWNER 授权）
#   2) 独立 Broker 证书/ACL/凭证就绪（R001 专属 CA；ACL 与生产 %u 模板一致）
#   3) 公网端口（默认 8884）与腾讯云安全组放行（OWNER 授权）
#   4) R001 车辆资产已 preregister + 协议绑定 VEHICLE_AGENT_V1（受控 API 路径）
#
# 启动:  docker compose -f compose.r001-independent.yml --env-file r001.env up -d --wait
# 停止:  docker compose -f compose.r001-independent.yml --env-file r001.env down   # 生产栈不受影响
# 回滚:  down 即回滚（本栈无状态卷；车辆数据停更，不影响历史数据）
name: u-dao-firebot-r001

services:
  r001-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "${R001_MQTT_PUBLIC_BIND:-127.0.0.1:8884:8883}"
    volumes:
      - ${R001_BROKER_CONF_DIR}/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${R001_BROKER_CONF_DIR}/acl:/mosquitto/config/acl:ro
      - ${R001_BROKER_CONF_DIR}/passwords:/mosquitto/config/passwords:ro
      - ${R001_BROKER_CONF_DIR}/certs:/mosquitto/config/certs:ro
      - r001_mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "8883",
             "--cafile", "/mosquitto/config/certs/ca.crt",
             "-u", "platform", "-P", "${R001_BROKER_PLATFORM_PASSWORD}",
             "-t", "_platform/vehicle-agent-v1/r001-hc", "-m", "1", "-q", "0"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - r001
      - u-dao-firebot # 生产 firebot 网络（external）：专属服务与生产 PG/Redis 互通

  r001-adapter:
    image: ${FIREBOT_PYTHON_IMAGE:-firebot-python:server}
    command: ["python", "/workspace/services/vehicle-agent-adapter/main.py"]
    environment:
      # 生产业务库/缓存：复用生产 app_secrets 卷（只读），绝不复制连接串到本目录
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      MQTT_HOST: r001-broker
      MQTT_PORT: "8883"
      MQTT_USERNAME: platform
      MQTT_PASSWORD: ${R001_BROKER_PLATFORM_PASSWORD}
      MQTT_TLS: "true"
      MQTT_CA_FILE: /run/mqtt-ca.crt
      MQTT_ALLOW_ANONYMOUS: "false"
      VEHICLE_AGENT_V1_DOWNLINK_ENABLED: "false"
      VEHICLE_AGENT_V1_ROLLOUT: "false"
      VEHICLE_AGENT_SCOPE_VEHICLE_IDS: ${R001_SCOPE_VEHICLE_IDS:-firebot-vehicle-01}
      FIREBOT_SERVICE_INSTANCE_ID: r001-dedicated-adapter
    volumes:
      - u-dao-firebot_app_secrets:/run/secrets:ro
      - ${R001_BROKER_CONF_DIR}/certs/ca.crt:/run/mqtt-ca.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "from app.core.vehicle_agent_health import adapter_healthy; import os; raise SystemExit(0 if adapter_healthy(instance=os.environ.get('FIREBOT_SERVICE_INSTANCE_ID')) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [r001]

  r001-ingress:
    image: ${FIREBOT_PYTHON_IMAGE:-firebot-python:server}
    command: ["python", "/workspace/services/mqtt-ingress/main.py"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      MQTT_HOST: r001-broker
      MQTT_PORT: "8883"
      MQTT_USERNAME: platform
      MQTT_PASSWORD: ${R001_BROKER_PLATFORM_PASSWORD}
      MQTT_TLS: "true"
      MQTT_CA_FILE: /run/mqtt-ca.crt
      MQTT_ALLOW_ANONYMOUS: "false"
      VEHICLE_AGENT_SCOPE_VEHICLE_IDS: ${R001_SCOPE_VEHICLE_IDS:-firebot-vehicle-01}
      FIREBOT_SERVICE_INSTANCE_ID: r001-dedicated-ingress
    volumes:
      - u-dao-firebot_app_secrets:/run/secrets:ro
      - ${R001_BROKER_CONF_DIR}/certs/ca.crt:/run/mqtt-ca.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "from app.core.events import get_redis; from app.core.service_identity import heartbeat_key; raise SystemExit(0 if get_redis().get(heartbeat_key('mqtt-ingress')) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [r001]

volumes:
  r001_mqtt_data:
  u-dao-firebot_app_secrets:
    external: true

networks:
  r001:
  u-dao-firebot:
    external: true
    name: u-dao-firebot_firebot
