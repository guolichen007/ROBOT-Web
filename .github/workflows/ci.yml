name: Firebot V2 CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "maintenance/**", "field/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: firebot_ci
          POSTGRES_USER: firebot_ci
          POSTGRES_PASSWORD: firebot_ci
        options: >-
          --health-cmd "pg_isready -U firebot_ci -d firebot_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:8.4.5-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://firebot_ci:firebot_ci@localhost:5432/firebot_ci
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      CSRF_SECRET: ci-csrf-secret-at-least-32-characters-long
      BOOTSTRAP_ADMIN_PASSWORD: Firebot-CI-Only-2026!
      SEED_DEMO: "true"
      ASSET_ROOT: /tmp/firebot-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check apps/api services scripts
      - run: ruff format --check apps/api services scripts
      - run: mypy apps/api/app services/protocol.py
      - run: python scripts/check_migration_manifest.py
      - run: |
          for file in services/*/main.py; do
            mypy --follow-imports=skip "$file"
          done
      - run: python scripts/test_migration_matrix.py
      - working-directory: apps/api
        run: alembic upgrade head && python -m app.db.seed
      - run: pytest apps/api/tests services/protocol-tester/tests scripts/test_secret_redaction.py
      - working-directory: apps/api
        run: alembic downgrade base && alembic upgrade head && python -m app.db.seed

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit production Critical and retain full audit
        run: node ../../scripts/audit_web_dependencies.cjs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-classification
          if-no-files-found: error
          path: artifacts/npm-audit-*.json
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock pytest==8.4.1 fakeredis==2.31.0 sortedcontainers==2.4.0
      - run: python scripts/check_protocol_drift.py
      - run: pytest services/protocol-tester/tests

  ros1-vehicle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bridge 单测（无 ROS 依赖）
        working-directory: integration/ros1/vehicle-bridge
        run: |
          python3 tests/test_bridge.py
          python3 tests/test_reliability.py
          python3 tests/test_field_console.py
          python3 tests/test_u2_freshness.py
          python3 tests/test_mecanum_odom.py
          python3 tests/test_location_freshness.py
          python3 tests/test_readonly_gate.py
          python3 tests/test_cutover_gate.py
      - name: Vehicle Edge 工程化测试（全部套件）
        run: |
          cd integration/ros1/vehicle-edge
          for t in test_edge_home test_monitor test_freshness test_precutover \
                   test_tools_release test_edge_rollback test_directory_governance \
                   test_git_independence test_help_contract \
                   test_production_default_env test_production_allowlist \
                   test_stable_edge_bin test_installer_transaction \
                   test_real_systemd_semantics test_systemd_mutation_matrix \
                   test_cutover_state_machine test_enrolled_preflight_production; do
            python3 "tests/$t.py" || exit 1
          done
          cd ../../..
          python3 scripts/test_edge_contract.py
      - name: Control STOP 安全测试
        run: python3 integration/ros1/vehicle-control/tests/test_stop_motion_safety.py
      - name: 生产链路合同（fleet register / 车端 TLS 信任链 / 只读铁律）
        run: python3 scripts/test_fleet_register_contract.py
      - name: 预登记与只读门合同（fleet preregister / readonly-preflight / readonly-start）
        run: python3 scripts/test_fleet_preregister_contract.py
      - name: 跨 Broker 切换事务合同（cutover boundary / rollback / exact SHA）
        run: python3 scripts/test_cutover_contract.py
      - name: py_compile 车端 Python
        run: |
          python3 -m compileall -q \
            integration/ros1/vehicle-bridge/firebot_bridge \
            integration/ros1/vehicle-bridge/tools \
            integration/ros1/vehicle-bridge/tests \
            integration/ros1/vehicle-control/scripts \
            integration/ros1/vehicle-control/tests
      - name: bash -n 车端脚本
        run: |
          set -euo pipefail
          for f in $(find integration/ros1 -name '*.sh' -type f | sort); do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: 明确 catkin/Noetic 为 FIELD gate（不伪造 PASS）
        run: |
          echo "catkin_make 需 ROS Noetic 环境；本 job 不伪造 catkin PASS。"
          echo "catkin/Noetic gate = FIELD/ROS_RUNNER gate（后续 self-hosted runner 补）。"

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_docs_links.py
      - run: python scripts/check_repository_policy.py
      - run: bash scripts/server-verify.sh --self-test
      - run: bash scripts/test_vehicle_agent_ops.sh
      - run: python scripts/test_server_rollback.py
      - run: python scripts/test_legacy_cutover.py
      - run: python scripts/generate_ros2_handoff.py
      - run: git diff --exit-code -- integration/ros2
      - run: python scripts/generate_ros2_handoff.py --dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebot-ros2-integration-1.2.0
          path: |
            dist/firebot-ros2-integration-1.2.0.zip
            dist/firebot-ros2-integration-1.2.0.sha256
          if-no-files-found: error
          retention-days: 90
      - run: python scripts/check_server_surface.py
      - run: python scripts/check_test_image_isolation.py

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose -f compose.dev.yml config --quiet
      - run: docker compose -f compose.test.yml config --quiet
      - run: SERVER_ENV_FILE=.env.server.example docker compose --env-file .env.server.example -f docker-compose.server.yml config --quiet
      - run: docker build -f infra/docker/python.Dockerfile -t firebot-api:ci .
      - run: docker build -f apps/web/Dockerfile -t firebot-web:ci .
      - run: docker build -f infra/docker/mediamtx.Dockerfile -t firebot-test-mediamtx:ci .
      # P0-A：公网媒体端口绑定启动级回归（真实 docker run + docker port；8189 双绑定负例）
      - run: python3 scripts/test_public_bind.py
      # P0-B：Node 侧 secret redaction 单测（media-test-source，node --test）
      - run: node --test services/media-test-source/test/redact.test.mjs
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.59.1 image --db-repository ghcr.io/aquasecurity/trivy-db:2 --exit-code 1 --severity CRITICAL --ignore-unfixed firebot-api:ci
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.59.1 image --db-repository ghcr.io/aquasecurity/trivy-db:2 --exit-code 1 --severity CRITICAL --ignore-unfixed firebot-web:ci

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, protocol, docs, containers]
    env:
      E2E_BASE_URL: http://127.0.0.1:18080
      E2E_ADMIN_PASSWORD: TestOnly-ChangeMe-2026!
      E2E_CHANGED_PASSWORD: Firebot-E2E-Changed-2026!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: docker compose -f compose.test.yml --profile full up -d --build --wait
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npm run test:e2e -- --grep-invert 'Browser → API → Outbox → adapter'
      - if: always()
        run: docker compose -f compose.test.yml --profile full logs --no-color > e2e-compose.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            e2e-compose.log
            apps/web/playwright-report/
            apps/web/test-results/
      - if: always()
        run: docker compose -f compose.test.yml --profile full down --volumes

  vehicle-agent-container-e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, protocol, docs, containers]
    env:
      E2E_BASE_URL: http://127.0.0.1:18080
      E2E_ADMIN_PASSWORD: TestOnly-ChangeMe-2026!
      TEST_VEHICLE_AGENT_DOWNLINK: "true"
      VEHICLE_AGENT_MOCK_E2E: "1"
      VEHICLE_AGENT_CONTAINER_E2E: "1"
      MOCK_SCENARIO_URL: http://127.0.0.1:18091/__mock__/scenario
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Real PostgreSQL Redis Mosquitto and v1 processes (canonical R001 disabled)
        run: docker compose -f compose.test.yml --profile full --profile vehicle-agent up -d --build --wait --scale mock-robot=0
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Vehicle agent spec RUN; skipped must equal zero
        working-directory: apps/web
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=vehicle-agent-results.json npx playwright test vehicle-agent-mock.spec.ts --reporter=list,json
          node ../../scripts/check_vehicle_agent_e2e.cjs vehicle-agent-results.json
      - if: always()
        run: docker compose -f compose.test.yml --profile full --profile vehicle-agent logs --no-color > vehicle-agent-compose.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vehicle-agent-container-e2e-diagnostics
          if-no-files-found: error
          retention-days: 14
          path: |
            vehicle-agent-compose.log
            apps/web/vehicle-agent-results.json
            apps/web/test-results/
            apps/web/artifacts/vehicle-agent-hmi-*.png
      - if: always()
        run: docker compose -f compose.test.yml --profile full --profile vehicle-agent down --volumes

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git --config=/repo/.gitleaks.toml --no-banner /repo
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.59.1 fs --db-repository ghcr.io/aquasecurity/trivy-db:2 --exit-code 1 --severity CRITICAL --ignore-unfixed /repo
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.59.1 fs --db-repository ghcr.io/aquasecurity/trivy-db:2 --exit-code 0 --severity HIGH,CRITICAL --format json --output /repo/trivy-high.json /repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-high-report
          path: trivy-high.json
