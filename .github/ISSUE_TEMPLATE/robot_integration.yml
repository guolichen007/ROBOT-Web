name: 车辆现场集成记录
description: 记录每台车现场集成证据（ROS1 / ROS2 / ROS_COMPAT 三条路径），不在本仓库开发车端节点
title: "[Vehicle Integration] "
labels: [robot-integration]
body:
  - type: input
    id: vehicle
    attributes: { label: Vehicle ID }
    validations: { required: true }
  - type: input
    id: sha
    attributes: { label: 精确 SHA / tag（运行基线） }
    validations: { required: true }
  - type: dropdown
    id: integration_path
    attributes:
      label: Integration path
      options:
        - ROS1 Vehicle Bridge / Schema 1.3
        - ROS2 Handoff / Schema 1.2
        - ROS_COMPAT Legacy / Read-only
    validations: { required: true }
  - type: input
    id: gate
    attributes: { label: 当前 Gate }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: 证据（Schema、topic、QoS、ACK，不得含 secret） }
    validations: { required: true }
  - type: textarea
    id: physical_safety
    attributes: { label: 物理安全边界（硬件急停 / 运动验证 / 未验证项） }
    validations: { required: true }
