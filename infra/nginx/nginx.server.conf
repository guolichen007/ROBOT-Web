worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 16m;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Never log query strings: media tickets are short-lived credentials.
  log_format firebot '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log firebot;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api_upstream { zone api_upstream 64k; server api:8000 resolve; }
  upstream web_upstream { zone web_upstream 64k; server web:80 resolve; }
  upstream media_upstream { zone media_upstream 64k; server mediamtx:8889 resolve; }

  server {
    listen 80;
    server_name _;
    location = /health/live { proxy_pass http://api_upstream; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /health/live { proxy_pass http://api_upstream; }
    location = /health/ready {
      allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
      proxy_pass http://api_upstream;
    }
    location = /metrics {
      allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
      proxy_pass http://api_upstream;
    }
    location ~ ^/api/(docs|openapi\.json) { return 404; }
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /ws/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
    location /media/ {
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass http://media_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / { proxy_pass http://web_upstream; }
  }
}
