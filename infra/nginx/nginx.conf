worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 16m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
  }
  upstream web_upstream {
    zone web_upstream 64k;
    server web:80 resolve;
  }
  upstream media_upstream {
    zone media_upstream 64k;
    server mediamtx:8889 resolve;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ { proxy_pass http://api_upstream; }
    location = /metrics { proxy_pass http://api_upstream; }

    location /ws/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /media/ {
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass http://media_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / { proxy_pass http://web_upstream; }
  }
}
