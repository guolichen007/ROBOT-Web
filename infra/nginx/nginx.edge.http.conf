# Firebot 内部 edge（U-Dao 云模式，HTTP-only）。
# TLS 由 U-Dao shared ingress（platform 资源）终结；edge 只负责 / /api/ /ws/ /media/ 内部路由。
# X-Forwarded-Proto 由 shared ingress 设置并原样透传（FastAPI --proxy-headers 使用，
# 保证 COOKIE_SECURE=true 在 bootstrap HTTPS 验收下正常工作）。
worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 16m;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Never log query strings: media tickets are short-lived credentials.
  log_format firebot '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log firebot;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api_upstream { zone api_upstream 64k; server api:8000 resolve; }
  upstream web_upstream { zone web_upstream 64k; server web:80 resolve; }
  upstream media_upstream { zone media_upstream 64k; server mediamtx:8889 resolve; }

  server {
    listen 80;
    server_name _;
    location = /health/live { proxy_pass http://api_upstream; }
    location = /health/ready {
      allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
      proxy_pass http://api_upstream;
    }
    location = /metrics {
      allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
      proxy_pass http://api_upstream;
    }
    location ~ ^/api/(docs|openapi\.json) { return 404; }
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /ws/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
    }
    location /media/ {
      proxy_pass http://media_upstream/;
      proxy_redirect / /media/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Authorization $http_authorization;
    }
    location / { proxy_pass http://web_upstream; }
  }
}
