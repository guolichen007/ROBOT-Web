persistence true
message_size_limit 262144
persistence_location /mosquitto/data/
log_dest stdout
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/secure/passwords
acl_file /mosquitto/secure/acl
cafile /mosquitto/secure/certs/ca.crt
certfile /mosquitto/secure/certs/server.crt
keyfile /mosquitto/secure/certs/server.key
require_certificate false
