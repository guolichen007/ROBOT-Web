persistence true
message_size_limit 262144
persistence_location /mosquitto/data/
log_dest stdout
# 显式边界（R2-6/8）：QoS0 不落盘入队（manual 脉冲断线不补发）；
# 持久会话离线队列上限与过期封顶，配合平台侧 MQTT5 Message Expiry Interval。
queue_qos0_messages false
max_queued_messages 1000
max_inflight_messages 50
persistent_client_expiration 24h
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/secure/passwords
acl_file /mosquitto/secure/acl
cafile /mosquitto/secure/certs/ca.crt
certfile /mosquitto/secure/certs/server.crt
keyfile /mosquitto/secure/certs/server.key
require_certificate false
