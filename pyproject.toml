[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packages/generated-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# G2：车端 ROS1 侧运行于 ROS Noetic 系统 Python 3.8（rospy），不得使用 3.11+ 的 datetime.UTC
"services/vehicle_agent_v1_exec/ros/*.py" = ["UP017"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["apps/api/alembic", "packages/generated-python"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "services/protocol-tester/tests"]
pythonpath = ["apps/api", "."]
addopts = "-q --disable-warnings --maxfail=1"
filterwarnings = [
  # starlette 1.6 起 TestClient 依赖 httpx 被标记弃用（第三方迁移提示）；
  # 仓库锁定 httpx==0.28.1/starlette==1.6.0 组合，仅过滤该弃用提示，不涉及门禁。
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
