name: firebot-test

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: firebot_test
      POSTGRES_USER: firebot_test
      POSTGRES_PASSWORD: firebot_test
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firebot_test -d firebot_test"]
      interval: 3s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.4.5-alpine
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes: ["./infra/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro"]
  tests:
    build:
      context: .
      dockerfile: infra/docker/python-test.Dockerfile
    working_dir: /workspace
    command: ["pytest"]
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://firebot_test:firebot_test@postgres:5432/firebot_test
      REDIS_URL: redis://redis:6379/15
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      JWT_SECRET: test-jwt-secret-at-least-32-bytes-long
      REFRESH_SECRET: test-refresh-secret-at-least-32-bytes
      CSRF_SECRET: test-csrf-secret-at-least-32-bytes-long
      BOOTSTRAP_ADMIN_PASSWORD: TestOnly-ChangeMe-2026!
      SEED_DEMO: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./:/workspace
