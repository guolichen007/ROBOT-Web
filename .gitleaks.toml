title = "Firebot Gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Exact non-production secrets used only by isolated CI and test profiles; migration manifest is a SHA256 integrity digest, not a credential"
regexTarget = "secret"
regexes = [
  '''ci-jwt-secret-at-least-32-characters-long''',
  '''ci-csrf-secret-at-least-32-characters-long''',
  '''ci-refresh-secret-at-least-32-characters''',
  '''test-jwt-secret-at-least-32-bytes-long''',
  '''test-csrf-secret-at-least-32-bytes-long''',
  '''Firebot-CI-Only-2026!''',
  '''Bootstrap-Server-Secret-2026!''',
  '''strong-password''',
  '''mqtt-secret''',
  # G1-R0：真实组件离线 E2E 与只读 Agent 隔离验收的测试专属凭证（仅 127.0.0.1 测试 broker）
  '''e2e-platform-password''',
  '''e2e-vehicle-01-password''',
  '''e2e-ghost-password''',
  '''e2e-jwt-secret-0123456789abcdef0123456789''',
  '''e2e-refresh-secret-0123456789abcdef012345''',
  '''e2e-csrf-secret-0123456789abcdef0123456789''',
  '''E2e-Only-Admin-Password-2026!''',
  '''firebot_e2e:firebot_e2e@localhost''',
  '''local-acceptance-cred-CHANGE-ME''',
  '''PLACEHOLDER-CHANGE-ME-G1''',
]
paths = [
  '''apps/api/alembic/versions/migration-sha256\.json''',
]
