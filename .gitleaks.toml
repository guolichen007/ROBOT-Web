title = "Firebot Gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Exact non-production secrets used only by isolated CI and test profiles"
regexTarget = "secret"
regexes = [
  '''ci-jwt-secret-at-least-32-characters-long''',
  '''ci-csrf-secret-at-least-32-characters-long''',
  '''ci-refresh-secret-at-least-32-characters''',
  '''test-jwt-secret-at-least-32-bytes-long''',
  '''test-csrf-secret-at-least-32-bytes-long''',
  '''Firebot-CI-Only-2026!''',
  '''Bootstrap-Server-Secret-2026!''',
  '''strong-password''',
  '''mqtt-secret''',
]

[allowlist.paths]
description = "迁移清单是 Alembic 文件完整性 SHA256 摘要，非凭据；dist 是构建产物"
paths = [
  '''apps/api/alembic/versions/migration-sha256\.json''',
]
