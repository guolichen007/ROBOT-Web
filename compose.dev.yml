name: firebot-dev

x-python-service: &python-service
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  env_file: .env
  restart: unless-stopped
  networks: [firebot]

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [firebot]

  redis:
    image: redis:8.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [firebot]

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports: ["1883:1883"]
    volumes:
      - ./infra/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [firebot]

  mediamtx:
    image: firebot-mediamtx:1.18.2
    build:
      context: .
      dockerfile: infra/docker/mediamtx.Dockerfile
    volumes: ["./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro"]
    ports: ["127.0.0.1:8554:8554", "127.0.0.1:8889:8889", "127.0.0.1:9997:9997"]
    restart: unless-stopped
    networks: [firebot]
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "-", "http://127.0.0.1:9997/v3/config/global/get"]
      interval: 5s
      timeout: 3s
      retries: 20

  asset-init:
    image: busybox:1.37.0-musl
    command: ["sh", "-c", "mkdir -p /data/assets && chown -R 10001:10001 /data/assets"]
    volumes: [assets_data:/data/assets]
    restart: "no"

  migrate:
    <<: *python-service
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    <<: *python-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: [assets_data:/data/assets]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      asset-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt-ingress:
    <<: *python-service
    command: ["python", "/workspace/services/mqtt-ingress/main.py"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_healthy }
      redis: { condition: service_healthy }

  command-dispatcher:
    <<: *python-service
    command: ["python", "/workspace/services/command-dispatcher/main.py"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_healthy }
      redis: { condition: service_healthy }

  task-worker:
    <<: *python-service
    command: ["python", "/workspace/services/task-worker/main.py"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  mock-robot:
    <<: *python-service
    command: ["python", "/workspace/services/mock-robot/main.py"]
    environment:
      MOCK_VEHICLE_ID: R001
      MOCK_MAP_CODE: parking_v1
      MOCK_MAP_VERSION: "1"
    depends_on:
      mosquitto: { condition: service_healthy }
      mqtt-ingress: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [firebot]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.30.4-alpine
    ports: ["8080:80"]
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
      mediamtx: { condition: service_healthy }
    restart: unless-stopped
    networks: [firebot]

networks:
  firebot:

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  assets_data:
